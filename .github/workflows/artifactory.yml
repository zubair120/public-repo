name: "Setup JFrog CLI OIDC Example"
on: push

permissions:
  # This is required for requesting the OIDC token
  id-token: write
  # This is required for actions/checkout
  contents: read
jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: zubair120/checkout@1.0
  # Adding as part of support case to capture the token ID
      - name: Show runner egress IP
        run: |
          echo "Runner hostname: $(hostname)"
          echo "Egress IP (ifconfig.me): $(curl -s https://ifconfig.me)"
          echo "Egress IP (ipify): $(curl -s https://api.ipify.org)"

      - name: Decode OIDC token
        run: |
          ID_TOKEN=$(curl -sLS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=githubcom" | jq -r .value)
          echo "===== OIDC JWT claims ====="
          echo "$ID_TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq .

          
      - name: Setup JFrog CLI
        uses: zubair120/setup-jfrog-cli@1.0
        env:
          # JFrog platform url (for example: https://acme.jfrog.io)
          JF_URL: https://dev.packages.broadcom.com
          
        with:
          # Name of the OIDC provider as specified on the OIDC integration page in the JFrog Platform
          oidc-provider-name: githubcom
          oidc-audience: githubcom

      - name: Run JFrog CLI
        run: |
          echo "JF_URL" 
          echo "JF_URL_DEV"
          echo "oidc-provider-name"
          echo "oidc-audience"
          
          # Ping the server
          jf rt ping
          # Collect environment variables for the build
          jf rt bce
          # Collect VCS details from git and add them to the build
          jf rt bag
          # Publish build info
          jf rt bp
